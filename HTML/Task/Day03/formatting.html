<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting</title>
</head>
<body>

    <h1>Formatting Tags</h1>

    <p>
        This is <b>First</b> paragraph. This is <strong>Strong</strong> and this is <i>italic</i>.
    </p>

    <p>
        This is <em>Second</em> paragraph.This is <mark>highlight </mark> and this is <u>under line</u>.
    </p>

    <p>
        This is 3<sub>rd</sub> paragraph. This is <small>small</small>.
    </p>

    <p>
        This is 4<sup>th</sup> paragraph. This is <del>delete</del>.
    </p>

    <p>
        This is <code>5th paragraph</code>. This is <q>quotation</q>.
    </p>

</body>
</html>
