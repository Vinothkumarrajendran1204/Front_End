<!DOCTYPE html>
<html>
<head>
    <title>Block Level Elements</title>
</head>
<body>

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <p>This is a paragraph element</p>
    <h3>Address</h3>
    <address>
        Name<br>
        Age<br>
        Qualification<br>
        Location
    </address>
    <h3>Unorder List</h3>
    <ul>
        <li>3</li>
        <li>1</li>
        <li>2</li>
    </ul>
    <h3>Order List</h3>
    <ol>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ol>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>

    <table border="2">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Vinoth</td>
            <td>22</td>
        </tr>
    </table>

    <form>
        <fieldset>
            <legend>Student Details</legend>

            <label>Name:</label><br>
            <input type="text"><br><br>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <input type="submit" value="Submit">
        </fieldset>
    </form>

</body>
</html>
