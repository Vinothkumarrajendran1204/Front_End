<!DOCTYPE html>
<html>
<head>
    <title>Interactive Tags Demo</title>
</head>
<body>

    <h1>HTML Interactive Tags</h1>

   
    <h2>Link</h2>
    <a href="https://www.google.com" target="_blank">Google Link</a>

    <hr>

    
    <h2>Button</h2>
    <button type="button" onclick="alert('Button Clicked!')">
        Click here
    </button>

    <hr>

    
    <h2>Details and Summary</h2>
    <details>
        <summary>Click to View Details</summary>
        <p>This is hidden content that appears when you click the summary.</p>
    </details>

    <hr>

    
    <h2>Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
