<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Job Application Form</h3>
    <form action="">
        <p><strong>Enter Your Details</strong></p>
        <label for="name">Enter Your Name:</label>
        <input type="text" placeholder="Name" id="name">
        <br>
        <br>
        <label for="age">Enter Your Age</label>
        <input type="number" placeholder="Age" id="age" min="18" max="30">
        <br>
        <br>
        <label for="ph-no">Enter Your Mobile Number</label>
        <input type="tel" placeholder="Mobile Number" id="ph-no" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="num">Enter Your Alternative Number</label>
        <input type="tel" placeholder="Mobile Number" id="num" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="mail">Enter your Email</label>
        <input type="email" placeholder="email id" id="mail">
        <br>
        <br>
        <label for="Degree">Qualification Status:</label>
        <select id="Degree" name="Degree">
            <option>BE</option>
            <option>B.Tech</option>
            <option>B.Sc</option>
            <option>BCA</option>
            <option>Masters</option>
            <option selected>Others</option>
        </select>
        <br>
        <br>
        <label>Employment Status</label>
        <br>
        <br>
        <input type="radio" id="fresher" name="status" value="Fresher">
        <label for="fresher">Fresher</label>
        <br>
        <br>
        <input type="radio" id="experience" name="status" value="Experience">
        <label for="experience">Experience</label>
        <br>
        <br>
        <label>If Experience fill this details</label>
        <br>
        <br>
        <textarea name="experience" id="" placeholder="Enter Your Experience Details Here"></textarea>
        <br>
        <br>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</body>
</html>
