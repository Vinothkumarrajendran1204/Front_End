<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Contact Form</h3>
    <form action="">
        <label for="name">Enter Your Name</label>
        <input type="text" placeholder="Name" id="name">
        <br>
        <br>
        <label for="ph-no">Enter Your Mobile Number</label>
        <input type="tel" placeholder="Mobile Number" id="ph-no" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="num">Enter Your Alternative Number</label>
        <input type="tel" placeholder="Mobile Number" id="num" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="mail">Enter your Email</label>
        <input type="email" placeholder="email id" id="mail">
        <br>
        <br>
        <label for="gnum">Enter Your Guardian Number</label>
        <input type="tel" placeholder="Mobile Number" id="gnum" minlength="10" maxlength="10">
        <br>
        <br>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</body>
</html>
