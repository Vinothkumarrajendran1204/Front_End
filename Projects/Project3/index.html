<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil Nadu TASMAC Smart Booking & Limit Management Portal</title>
  <meta name="description" content="Official Tamil Nadu TASMAC Smart Advance Token Booking, Aadhaar-verified weekly alcohol and cigarette quota management system.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f5a34%22/><text y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%23ffffff%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>TN</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Rendered dynamically by js/app.js -->
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; font-family:sans-serif; color:#0f5a34;">
      <div style="width:48px; height:48px; border:4px solid #e2e8f0; border-top-color:#0f5a34; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
      <div style="font-weight:700; font-size:1.1rem;">Loading TASMAC Smart Portal...</div>
    </div>
  </div>

  <noscript>
    <div style="padding:2rem; text-align:center; color:#dc2626;">
      JavaScript is required to access the Tamil Nadu TASMAC Smart Booking portal. Please enable JavaScript in your browser settings.
    </div>
  </noscript>

  <!-- Scripts in dependency order -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
