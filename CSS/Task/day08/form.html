<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/form.css">
</head>
<body>
    <div>
        <form action="">
            <p><strong>Enter Your Details</strong></p>
            <label for="name">Enter Your Name:</label>
            <input class="form" type="text" placeholder="Name" id="name">
            <br>
            <br>
            <label for="ph-no">Enter Your Mobile Number</label>
            <input class="form" type="tel" placeholder="Mobile Number" id="ph-no" minlength="10" maxlength="10">
            <br>
            <br>
            <label for="mail">Enter your Email</label>
            <input class="form" type="email" placeholder="email id" id="mail">
            <br>
            <br>
            <label for="pass">Enter your password</label>
            <input class="form" type="password" placeholder="Enter your password" id="pass">
    </div>
</body>
</html>
